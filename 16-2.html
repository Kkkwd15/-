        /* ======================= 渲染工具 ======================= */

        // 把数组画成方块
        function arrayBoxes(arr, cls, withIndex) {
            if (arr.length === 0) {
                return '<span class="empty">[] （空数组）</span>';
            }
            return arr.map(function (v, i) {
                var value = Array.isArray(v) ? "[" + v.join(",") + "]" : v;
                return '<div class="slot">' +
                    '<div class="box ' + cls + '">' + escapeHtml(String(value)) + '</div>' +
                    (withIndex ? '<span class="idx">' + i + '</span>' : '') +
                    '</div>';
            }).join("");
        }

        // 把字符串画成带下标的字符方块，可高亮 [start, end)
        function charBoxes(str, hl) {
            if (str.length === 0) {
                return '<span class="empty">"" （空字符串）</span>';
            }
            return str.split("").map(function (ch, i) {
                var isHl = hl && i >= hl[0] && i < hl[1];
                var text = ch === " " ? "␣" : ch;
                return '<div class="slot">' +
                    '<div class="box char ' + (isHl ? "hl" : "") + '">' + escapeHtml(text) + '</div>' +
                    '<span class="idx">' + i + '</span>' +
                    '</div>';
            }).join("");
        }

        // 把对象画成键值卡片，addedKeys 里的键标绿表示新增
        function objCards(obj, addedKeys) {
            var keys = Object.keys(obj);
            if (keys.length === 0) {
                return '<span class="empty">{ } （空对象）</span>';
            }
            return '<div class="obj-cards">' + keys.map(function (key) {
                var value = obj[key];
                var text = Array.isArray(value)
                    ? "[" + value.join(", ") + "]"
                    : (typeof value === "object" && value !== null)
                        ? "{" + Object.keys(value).join(", ") + "}"
                        : value;
                var isAdded = addedKeys && addedKeys.indexOf(key) > -1;
                return '<div class="obj-card ' + (isAdded ? "added" : "") + '">' +
                    '<div class="obj-key">' + escapeHtml(key) + '</div>' +
                    '<div class="obj-val">' + escapeHtml(String(text)) + '</div>' +
                    '</div>';
            }).join("") + '</div>';
        }

        // 按返回值类型自动选择合适的画法
        function renderValue(value) {
            if (Array.isArray(value)) {
                return '<div class="boxes">' + arrayBoxes(value, "result", false) + '</div>';
            }
            if (value !== null && typeof value === "object") {
                return objCards(value, null);
            }
            if (typeof value === "string") {
                return '<div class="boxes">' + charBoxes(value, null) + '</div>';
            }
            if (typeof value === "undefined") {
                return '<span class="empty">undefined</span>';
            }
            return '<span class="scalar">' + escapeHtml(String(value)) + '</span>';
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 按分组生成按钮
        function buildButtons(container, demos, onPick) {
            var groups = [];
            demos.forEach(function (demo) {
                if (groups.indexOf(demo.group) === -1) {
                    groups.push(demo.group);
                }
            });

            groups.forEach(function (group) {
                var wrapper = document.createElement("div");
                wrapper.style.marginBottom = "14px";

                var label = document.createElement("div");
                label.className = "group-name " + (group === "增删改" ? "mutate" : "pure");
                label.textContent = group;
                wrapper.appendChild(label);

                var row = document.createElement("div");
                row.className = "methods";

                demos.forEach(function (demo) {
                    if (demo.group !== group) {
                        return;
                    }
                    var btn = document.createElement("button");
                    btn.className = "method";
                    btn.textContent = demo.name;
                    btn.addEventListener("click", function () {
                        container.querySelectorAll("button.method").forEach(function (item) {
                            item.classList.remove("active");
                        });
                        btn.classList.add("active");
                        onPick(demo);
                    });
                    row.appendChild(btn);
                });

                wrapper.appendChild(row);
                container.appendChild(wrapper);
            });
        }

        /* ======================= 对象：初始化与执行 ======================= */

        var objSource = document.getElementById("objSource");
        var objMethods = document.getElementById("objMethods");
        var objPanel = document.getElementById("objPanel");

        objSource.innerHTML = objCards(BASE_OBJ, null);

        function showObjDemo(demo) {
            var source = demo.source || BASE_OBJ;
            var work = JSON.parse(JSON.stringify(source));
            var result = demo.run(work);

            // 判断原对象是否被改变，以及新增了哪些键
            var before = Object.keys(source);
            var after = Object.keys(work);
            var added = after.filter(function (k) {
                return before.indexOf(k) === -1;
            });
            var changed = JSON.stringify(work) !== JSON.stringify(source);

            var html = "";
            html += '<div class="panel-head">' +
                '<code>' + escapeHtml(demo.code) + '</code>' +
                '<span class="badge ' + (changed ? "mutate" : "pure") + '">' +
                (changed ? "原对象已被改变" : "原对象保持不变") + '</span>' +
                '<span class="tip">返回值：' + demo.returns + '</span>' +
                '</div>';
            html += '<p class="desc">' + demo.desc + '</p>';

            html += '<div class="row-label">调用前：</div>';
            html += objCards(source, null);

            html += '<div class="row-label" style="margin-top:14px;">返回结果：</div>';
            html += renderValue(result);

            if (changed) {
                html += '<div class="row-label" style="margin-top:14px;">调用后的对象（绿色为新增属性）：</div>';
                html += objCards(work, added);
            }

            objPanel.innerHTML = html;
        }

        buildButtons(objMethods, objDemos, showObjDemo);

        /* ======================= 字符串：初始化与执行 ======================= */

        var strSource = document.getElementById("strSource");
        var strMethods = document.getElementById("strMethods");
        var strPanel = document.getElementById("strPanel");

        document.getElementById("strLen").textContent = BASE_STR.length;
        strSource.innerHTML = charBoxes(BASE_STR, null);

        function showStrDemo(demo) {
            var source = demo.source || BASE_STR;
            var result = demo.run(source);

            var html = "";
            html += '<div class="panel-head">' +
                '<code>' + escapeHtml(demo.code) + '</code>' +
                '<span class="badge pure">字符串不可变，原字符串始终不变</span>' +
                '<span class="tip">返回值：' + demo.returns + '</span>' +
                '</div>';
            html += '<p class="desc">' + demo.desc + '</p>';

            if (demo.template) {
                html += '<div class="row-label">参与拼接的对象：</div>';
                html += objCards(BASE_OBJ, null);
                html += '<div class="row-label" style="margin-top:14px;">拼接结果：</div>';
                html += '<div class="boxes">' + charBoxes(result, null) + '</div>';
                strPanel.innerHTML = html;
                return;
            }

            html += '<div class="row-label">原字符串（黄色为本次用到的字符）：</div>';
            html += '<div class="boxes">' + charBoxes(source, demo.hl) + '</div>';

            html += '<div class="row-label" style="margin-top:14px;">返回结果：</div>';
            html += renderValue(result);

            strPanel.innerHTML = html;
        }

        buildButtons(strMethods, strDemos, showStrDemo);

        /* ======================= 总览表 ======================= */

        document.getElementById("objTable").innerHTML = objDemos.map(function (demo) {
            return '<tr>' +
                '<td><code>' + escapeHtml(demo.code) + '</code></td>' +
                '<td>' + demo.desc + '</td>' +
                '<td>' + demo.returns + '</td>' +
                '<td>' + (demo.mutate ? "是" : "否") + '</td>' +
                '</tr>';
        }).join("");

        document.getElementById("strTable").innerHTML = strDemos.map(function (demo) {
            return '<tr>' +
                '<td><code>' + escapeHtml(demo.code) + '</code></td>' +
                '<td>' + demo.desc + '</td>' +
                '<td>' + demo.returns + '</td>' +
                '<td>否</td>' +
                '</tr>';
        }).join("");

        /* ======================= 默认示例 ======================= */

        objMethods.querySelector("button.method").classList.add("active");
        showObjDemo(objDemos[0]);

        strMethods.querySelector("button.method").classList.add("active");
        showStrDemo(strDemos[0]);
    </script>
</body>
</html>
