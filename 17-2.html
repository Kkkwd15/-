<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API 实践 - 孙宁 24001011016</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .student-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 25px;
        }
        #imageContainer {
            width: 100%;
            height: 350px;
            background: #eee;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        #dogImage {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="student-info">孙宁 - 24001011016</div>
        <h1>17-2 获取接口数据并展示</h1>
        <div id="imageContainer">
            <div class="loader" id="loader"></div>
            <img id="dogImage" alt="随机狗狗图片">
        </div>
        <button onclick="fetchDog()">换一张狗狗图片</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        async function fetchDog() {
            const img = document.getElementById('dogImage');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');

            // 重置状态
            img.style.display = 'none';
            loader.style.display = 'block';
            status.innerText = '正在获取数据...';

            try {
                const response = await fetch('https://dog.ceo/api/breeds/image/random');
                if (!response.ok) throw new Error('网络响应错误');
                
                const data = await response.json();
                
                img.src = data.message;
                img.onload = () => {
                    loader.style.display = 'none';
                    img.style.display = 'block';
                    status.innerText = '成功获取一张狗狗图片！';
                };
            } catch (error) {
                loader.style.display = 'none';
                status.style.color = '#e74c3c';
                status.innerText = '获取失败: ' + error.message;
            }
        }

        // 页面加载时自动获取一次
        fetchDog();
    </script>
</body>
</html>
