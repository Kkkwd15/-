<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异步操作演示 - 孙宁 24001011016</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #fff7ed;
            padding: 40px;
            line-height: 1.6;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(120, 53, 15, 0.1);
        }
        .student-info {
            text-align: right;
            font-weight: bold;
            color: #c2410c;
            margin-bottom: 20px;
        }
        h1 {
            color: #9a3412;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #ffedd5;
            padding-bottom: 15px;
        }
        .process-list {
            list-style: none;
            padding: 0;
        }
        .step {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #fffaf0;
            border-radius: 10px;
            border-left: 5px solid #fdba74;
            opacity: 0.5;
            transition: all 0.5s;
        }
        .step.active {
            opacity: 1;
            transform: translateX(10px);
            border-left-color: #f97316;
            background: #fff7ed;
            font-weight: bold;
        }
        .step.done {
            opacity: 0.8;
            border-left-color: #22c55e;
            background: #f0fdf4;
        }
        .step-icon {
            font-size: 24px;
            margin-right: 15px;
        }
        .step-time {
            margin-left: auto;
            font-size: 12px;
            color: #94a3b8;
        }
        #startBtn {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            padding: 15px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(249, 115, 22, 0.3);
        }
        #startBtn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }
        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid #f97316;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
            margin-left: 10px;
            display: none;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="student-info">孙宁 - 24001011016</div>
        <h1>17-6 异步操作：包饺子流程</h1>
        
        <ul class="process-list" id="processList">
            <li class="step" id="step1">
                <span class="step-icon">🛒</span>
                <span class="step-text">先买原料 (需要 6 秒)</span>
                <div class="loader" id="loader1"></div>
            </li>
            <li class="step" id="step2">
                <span class="step-icon">🥡</span>
                <span class="step-text">取原料</span>
            </li>
            <li class="step" id="step3">
                <span class="step-icon">🥣</span>
                <span class="step-text">同时进行：和面</span>
                <div class="loader" id="loader3"></div>
            </li>
            <li class="step" id="step4">
                <span class="step-icon">🥬</span>
                <span class="step-text">同时进行：和馅</span>
                <div class="loader" id="loader4"></div>
            </li>
            <li class="step" id="step5">
                <span class="step-icon">🥟</span>
                <span class="step-text">包饺子</span>
            </li>
            <li class="step" id="step6">
                <span class="step-icon">😋</span>
                <span class="step-text">吃饺子</span>
            </li>
        </ul>

        <button id="startBtn" onclick="startCooking()">开始包饺子</button>
    </div>

    <script>
        function updateStep(id, status) {
            const el = document.getElementById(id);
            const loader = document.getElementById('loader' + id.slice(-1));
            
            el.className = 'step ' + status;
            if (loader) {
                loader.style.display = (status === 'active') ? 'inline-block' : 'none';
            }
        }

        // 模拟异步操作的函数
        function simulate(name, seconds) {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve(name);
                }, seconds * 1000);
            });
        }

        async function startCooking() {
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.innerText = '正在制作中...';

            // 1. 先买原料 (6s)
            updateStep('step1', 'active');
            await simulate('买原料', 6);
            updateStep('step1', 'done');

            // 2. 取原料 (1s)
            updateStep('step2', 'active');
            await simulate('取原料', 1);
            updateStep('step2', 'done');

            // 3. 同时进行：和面 和 和馅 (3s)
            updateStep('step3', 'active');
            updateStep('step4', 'active');
            
            await Promise.all([
                simulate('和面', 3).then(() => updateStep('step3', 'done')),
                simulate('和馅', 3).then(() => updateStep('step4', 'done'))
            ]);

            // 4. 包饺子 (2s)
            updateStep('step5', 'active');
            await simulate('包饺子', 2);
            updateStep('step5', 'done');

            // 5. 吃饺子
            updateStep('step6', 'active');
            await simulate('吃饺子', 1);
            updateStep('step6', 'done');

            btn.innerText = '制作完成！';
            btn.style.background = '#22c55e';
        }
    </script>
</body>
</html>
