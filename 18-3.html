<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库智能客服系统架构图 (SVG) - 孙宁</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f4f6fa;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        h2 { color: #2c3e50; margin-bottom: 4px; letter-spacing: 1px; }
        p.author { color: #8a97a8; font-size: 13px; margin: 0 0 14px; }
        svg {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(30, 50, 90, 0.12);
        }
        .layer-title { font-size: 14px; font-weight: bold; font-family: 'PingFang SC', 'Microsoft YaHei'; }
        .node-text   { font-size: 13px; fill: #2c3e50; font-family: 'PingFang SC', 'Microsoft YaHei'; text-anchor: middle; dominant-baseline: middle; }
        .sub-text    { font-size: 11px; fill: #7f8c9b; font-family: 'PingFang SC', 'Microsoft YaHei'; text-anchor: middle; }
        .side-text   { font-size: 12px; fill: #ffffff; font-family: 'PingFang SC', 'Microsoft YaHei'; text-anchor: middle; }
        .link        { stroke: #7a8ba3; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
        .link-dash   { stroke: #b0455a; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowRed); }
    </style>
</head>
<body>
    <h2>基于知识库的智能客服系统架构图（科研方向）</h2>
    <p class="author">设计：孙宁</p>

    <svg width="980" height="700" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8ba3"/>
            </marker>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0455a"/>
            </marker>
            <linearGradient id="gLayer" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="1" stop-color="#f2f5fa"/>
            </linearGradient>
            <linearGradient id="gNode" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="1" stop-color="#eef3fb"/>
            </linearGradient>
        </defs>

        <!-- ================= 第一层：交互接入层 ================= -->
        <rect x="30" y="20" width="760" height="96" rx="10" fill="url(#gLayer)" stroke="#c5d3e8"/>
        <text x="50" y="42" class="layer-title" fill="#2563a8">① 交互接入层</text>
        <rect x="70"  y="58" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#7fa8d9"/>
        <text x="145" y="78" class="node-text">Web 网页端</text>
        <rect x="250" y="58" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#7fa8d9"/>
        <text x="325" y="78" class="node-text">微信 / 小程序</text>
        <rect x="430" y="58" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#7fa8d9"/>
        <text x="505" y="78" class="node-text">移动 APP</text>
        <rect x="610" y="58" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#7fa8d9"/>
        <text x="685" y="78" class="node-text">语音电话接入</text>

        <!-- ================= 第二层：对话服务层 ================= -->
        <rect x="30" y="146" width="760" height="96" rx="10" fill="url(#gLayer)" stroke="#c5d3e8"/>
        <text x="50" y="168" class="layer-title" fill="#8a5fb0">② 对话服务层</text>
        <rect x="70"  y="184" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#a689cf"/>
        <text x="145" y="204" class="node-text">会话管理</text>
        <rect x="250" y="184" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#a689cf"/>
        <text x="325" y="204" class="node-text">多轮对话状态跟踪</text>
        <rect x="430" y="184" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#a689cf"/>
        <text x="505" y="204" class="node-text">人工坐席转接</text>
        <rect x="610" y="184" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#a689cf"/>
        <text x="685" y="204" class="node-text">满意度评价</text>

        <!-- ================= 第三层：AI 智能核心层 ================= -->
        <rect x="30" y="272" width="760" height="120" rx="10" fill="#f6f0ff" stroke="#b79ae0"/>
        <text x="50" y="294" class="layer-title" fill="#6d3fa8">③ AI 智能核心层</text>
        <rect x="60"  y="312" width="160" height="60" rx="8" fill="#ffffff" stroke="#9a6fd0"/>
        <text x="140" y="336" class="node-text">意图识别 NLU</text>
        <text x="140" y="356" class="sub-text">TextCNN / BERT</text>
        <rect x="240" y="312" width="160" height="60" rx="8" fill="#ffffff" stroke="#9a6fd0"/>
        <text x="320" y="336" class="node-text">实体抽取 NER</text>
        <text x="320" y="356" class="sub-text">BiLSTM-CRF</text>
        <rect x="420" y="312" width="160" height="60" rx="8" fill="#ffffff" stroke="#9a6fd0"/>
        <text x="500" y="336" class="node-text">对话管理 DM</text>
        <text x="500" y="356" class="sub-text">DST 状态追踪</text>
        <rect x="600" y="312" width="160" height="60" rx="8" fill="#ffffff" stroke="#9a6fd0"/>
        <text x="680" y="336" class="node-text">答案生成 NLG</text>
        <text x="680" y="356" class="sub-text">LLM + RAG 检索增强</text>

        <!-- ================= 第四层：知识库层 ================= -->
        <rect x="30" y="422" width="760" height="120" rx="10" fill="#f0f7f2" stroke="#8fc7a5"/>
        <text x="50" y="444" class="layer-title" fill="#2e8b57">④ 知识库层（RAG 检索增强生成）</text>
        <rect x="60"  y="462" width="160" height="60" rx="8" fill="#ffffff" stroke="#5aa97c"/>
        <text x="140" y="486" class="node-text">向量知识库</text>
        <text x="140" y="506" class="sub-text">Embedding + Milvus</text>
        <rect x="240" y="462" width="160" height="60" rx="8" fill="#ffffff" stroke="#5aa97c"/>
        <text x="320" y="486" class="node-text">知识图谱</text>
        <text x="320" y="506" class="sub-text">Neo4j 实体关系推理</text>
        <rect x="420" y="462" width="160" height="60" rx="8" fill="#ffffff" stroke="#5aa97c"/>
        <text x="500" y="486" class="node-text">FAQ 问答对库</text>
        <text x="500" y="506" class="sub-text">BM25 + 语义召回</text>
        <rect x="600" y="462" width="160" height="60" rx="8" fill="#ffffff" stroke="#5aa97c"/>
        <text x="680" y="486" class="node-text">文档语料库</text>
        <text x="680" y="506" class="sub-text">PDF / Word 解析入库</text>

        <!-- ================= 第五层：数据与反馈层 ================= -->
        <rect x="30" y="572" width="760" height="96" rx="10" fill="url(#gLayer)" stroke="#c5d3e8"/>
        <text x="50" y="594" class="layer-title" fill="#b05a3a">⑤ 数据与反馈层</text>
        <rect x="70"  y="610" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#d99a7f"/>
        <text x="145" y="630" class="node-text">业务数据库</text>
        <rect x="250" y="610" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#d99a7f"/>
        <text x="325" y="630" class="node-text">对话日志库</text>
        <rect x="430" y="610" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#d99a7f"/>
        <text x="505" y="630" class="node-text">Badcase 标注</text>
        <rect x="610" y="610" width="150" height="40" rx="8" fill="url(#gNode)" stroke="#d99a7f"/>
        <text x="685" y="630" class="node-text">知识更新回流</text>

        <!-- ================= 右侧：科研方向标注 ================= -->
        <rect x="820" y="20" width="130" height="648" rx="10" fill="#34495e"/>
        <text x="885" y="60" class="side-text" font-weight="bold" font-size="14px">科研方向</text>
        <line x1="838" y1="76" x2="932" y2="76" stroke="#5d7285"/>
        <text x="885" y="120" class="side-text">RAG 检索增强</text>
        <text x="885" y="140" class="side-text">生成技术</text>
        <text x="885" y="200" class="side-text">知识图谱构建</text>
        <text x="885" y="220" class="side-text">与图推理</text>
        <text x="885" y="280" class="side-text">多轮对话</text>
        <text x="885" y="300" class="side-text">状态追踪优化</text>
        <text x="885" y="360" class="side-text">大模型幻觉</text>
        <text x="885" y="380" class="side-text">抑制策略</text>
        <text x="885" y="440" class="side-text">Badcase 挖掘</text>
        <text x="885" y="460" class="side-text">与知识自动</text>
        <text x="885" y="480" class="side-text">更新闭环</text>

        <!-- ================= 层间连线 ================= -->
        <line x1="410" y1="98"  x2="410" y2="184" class="link"/>
        <line x1="410" y1="224" x2="410" y2="312" class="link"/>
        <!-- 核心层内部横向流 -->
        <line x1="220" y1="342" x2="240" y2="342" class="link"/>
        <line x1="400" y1="342" x2="420" y2="342" class="link"/>
        <line x1="580" y1="342" x2="600" y2="342" class="link"/>
        <!-- NLG → 知识库（检索） -->
        <line x1="680" y1="372" x2="680" y2="462" class="link"/>
        <!-- 知识库 → 数据层 -->
        <line x1="410" y1="522" x2="410" y2="610" class="link"/>
        <!-- 反馈闭环：Badcase 标注 → 知识库层（红色虚线） -->
        <path d="M 505 610 L 505 550 L 320 550 L 320 522" class="link-dash"/>
        <text x="412" y="543" class="sub-text" fill="#b0455a">知识更新闭环</text>
    </svg>
</body>
</html>
