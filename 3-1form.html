<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1016孙宁</title>
</head>
<body>
   <h2>表单</h2>
   <form action="http://www.huanqiu.com" name="y1">
       <p>用户名：<input type="text" name="username" placeholder="请输入用户名"></p>
       <p>密码：<input type="password" name="password" placeholder="请输入密码"></p>
       <!--性别 男 女 保密 -->
       <p>性别：
           <input type="radio" name="sex" value="男">男
           <input type="radio" name="sex" value="女">女
           <input type="radio" name="sex" value="保密">保密
       </p>
       <!--爱好 篮球 足球 羽毛球 -->
       <p>爱好：
           <input type="checkbox" name="hobby" value="篮球">篮球
           <input type="checkbox" name="hobby" value="足球">足球
           <input type="checkbox" name="hobby" value="羽毛球">羽毛球
           <input type="checkbox" name="hobby" value="乒乓球">乒乓球
    
       </p>
       <!--籍贯-->
       <p>籍贯：
           <select name="city" id="">
               <option value="北京">北京</option>
               <option value="上海">上海</option>
               <option value="广州">广州</option>
               <option value="深圳">深圳</option>
           </select>
       </p>
       <!--自我介绍-->
       <p>自我介绍：
           <textarea name="introduce" id="" cols="30" rows="10"></textarea>
       </p>
       <!--提交按钮-->
       <p>
           <input type="submit" value="提交">
           <input type="reset" value="重置">
       </p>
       <!-- 出生日期 -->
       <p>出生日期：
           <input type="date" name="birthday">
       </p>
       <!-- 多文件上传 -->
       <p>上传文件：
           <input type="file" name="file" multiple>
       </p>
       <!-- 按钮：普通按钮，提交按钮，重置按钮 -->
       <p>
           <input type="button" value="普通按钮">
           <input type="submit" value="提交按钮">
           <input type="reset" value="重置按钮">
       </p>
   </form>
   <!-- 表单外的按钮button -->
   <button>按钮</button>
      
</body>
</html>
