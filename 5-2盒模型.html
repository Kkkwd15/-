<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型,框模型,box model  </title>
    <style>
        .a{
            width: 500px;
            height: 500px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px;
            margin: 40px auto;
            /* 上下，左右，左右margin为auto则盒子居中 */
        }
        .b{
            width: 500px;
            height: 500px;
            border: 2px dashed #039;
            margin: 50px auto 40px;
        }
        .c{
            width: 300px;
            height: 200px;
            border: 3px solid #c03;
            padding: 20px;
            margin: 30px auto;
            background-color: #ffe4f0;
            box-sizing: content-box;
            text-align: center;
            line-height: 200px;
        }
    </style>
</head>
<body>
    <div class="a">016孙宁</div>
    <div class="b">016孙宁</div>
    <div class="c">016孙宁</div>
</body>
</html>
